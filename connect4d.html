<!DOCTYPE html>
<html lang="en" data-theme="light" data-aesthetic="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONNECT 4D // Tesseract Strategy Matrix</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Orbitron', 'sans-serif'],
            hand: ['Architects Daughter', 'cursive'],
            typewriter: ['Courier Prime', 'monospace']
          },
          colors: {
            p1: {
              DEFAULT: '#00f2fe',
              dim: 'rgba(0, 242, 254, 0.18)',
              glow: 'rgba(0, 242, 254, 0.65)',
              deep: '#0284c7'
            },
            p2: {
              DEFAULT: '#ff7b54',
              dim: 'rgba(255, 123, 84, 0.18)',
              glow: 'rgba(255, 123, 84, 0.65)',
              deep: '#e11d48'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* ==========================================================================
       THEME & AESTHETIC DESIGN TOKENS
       ========================================================================== */
    :root,
    html[data-aesthetic="paper"][data-theme="light"] {
      --bg-void: #f3ede0;
      --bg-page-gradient:
        radial-gradient(circle at 20% 20%, rgba(214, 199, 169, 0.35) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(198, 180, 148, 0.35) 0%, transparent 50%),
        linear-gradient(to bottom, #f6f1e6 0%, #ede4d1 100%);
      --grid-line-color: rgba(110, 138, 168, 0.18);
      --grid-sub-color: rgba(110, 138, 168, 0.08);
      --bg-panel: #fbf8f1;
      --bg-subpanel: #f3ede0;
      --bg-control: #efe8d8;
      --bg-cell: #fdfbf7;
      --border-panel: #3a312a;
      --border-subpanel: #9c8f7a;
      --border-cell: #8c7f6a;
      --panel-shadow: 2px 2px 0px rgba(58, 49, 42, 0.18);
      --text-main: #231f1c;
      --text-muted: #5c5349;
      --text-faint: #877b6c;
      --p1-color: #1d4ed8;
      --p1-soft: rgba(29, 78, 216, 0.12);
      --p1-border: #1e40af;
      --p2-color: #c2410c;
      --p2-soft: rgba(194, 65, 12, 0.12);
      --p2-border: #9a3412;
      --font-heading: 'Architects Daughter', cursive;
      --font-body: 'Courier Prime', monospace;
      --font-code: 'Courier Prime', monospace;
      --panel-radius: 10px;
    }

    html[data-aesthetic="paper"][data-theme="dark"] {
      --bg-void: #1b1917;
      --bg-page-gradient:
        radial-gradient(circle at 18% 18%, rgba(68, 60, 52, 0.25) 0%, transparent 45%),
        linear-gradient(to bottom, #1e1c19 0%, #151311 100%);
      --grid-line-color: rgba(214, 201, 180, 0.09);
      --grid-sub-color: rgba(214, 201, 180, 0.04);
      --bg-panel: #262320;
      --bg-subpanel: #1e1b18;
      --bg-control: #171513;
      --bg-cell: #2c2825;
      --border-panel: #a89b88;
      --border-subpanel: #5c5349;
      --border-cell: #6e6459;
      --panel-shadow: 2px 2px 0px rgba(0, 0, 0, 0.55);
      --text-main: #f0e9dc;
      --text-muted: #b5a997;
      --text-faint: #7d7265;
      --p1-color: #60a5fa;
      --p1-soft: rgba(96, 165, 250, 0.16);
      --p1-border: #93c5fd;
      --p2-color: #fb923c;
      --p2-soft: rgba(251, 146, 60, 0.16);
      --p2-border: #fdba74;
      --font-heading: 'Architects Daughter', cursive;
      --font-body: 'Courier Prime', monospace;
      --font-code: 'Courier Prime', monospace;
      --panel-radius: 10px;
    }

    html[data-aesthetic="scifi"][data-theme="light"] {
      --bg-void: #eef4fa;
      --bg-page-gradient:
        radial-gradient(circle at 12% 18%, rgba(2, 132, 199, 0.10) 0%, transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(234, 88, 12, 0.10) 0%, transparent 38%),
        linear-gradient(to bottom, #f4f8fc 0%, #e5eff8 100%);
      --grid-line-color: rgba(15, 23, 42, 0.06);
      --grid-sub-color: rgba(15, 23, 42, 0.03);
      --bg-panel: rgba(255, 255, 255, 0.88);
      --bg-subpanel: rgba(241, 245, 249, 0.92);
      --bg-control: #e2e8f0;
      --bg-cell: #ffffff;
      --border-panel: rgba(100, 116, 139, 0.28);
      --border-subpanel: rgba(100, 116, 139, 0.22);
      --border-cell: #cbd5e1;
      --panel-shadow: 0 8px 20px -6px rgba(15, 23, 42, 0.12);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-faint: #64748b;
      --p1-color: #0284c7;
      --p1-soft: rgba(2, 132, 199, 0.12);
      --p1-border: #0284c7;
      --p2-color: #ea580c;
      --p2-soft: rgba(234, 88, 12, 0.12);
      --p2-border: #ea580c;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --panel-radius: 14px;
    }

    html[data-aesthetic="scifi"][data-theme="dark"] {
      --bg-void: #060913;
      --bg-page-gradient:
        radial-gradient(circle at 12% 18%, rgba(0, 242, 254, 0.08) 0%, transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(255, 123, 84, 0.08) 0%, transparent 38%),
        linear-gradient(to bottom, #050811 0%, #090e1c 100%);
      --grid-line-color: rgba(148, 163, 184, 0.05);
      --grid-sub-color: rgba(148, 163, 184, 0.02);
      --bg-panel: rgba(13, 20, 38, 0.78);
      --bg-subpanel: rgba(15, 23, 42, 0.65);
      --bg-control: rgba(2, 6, 23, 0.85);
      --bg-cell: rgba(15, 23, 42, 0.9);
      --border-panel: rgba(148, 163, 184, 0.18);
      --border-subpanel: rgba(148, 163, 184, 0.14);
      --border-cell: rgba(30, 41, 59, 0.95);
      --panel-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --p1-color: #00f2fe;
      --p1-soft: rgba(0, 242, 254, 0.15);
      --p1-border: #00f2fe;
      --p2-color: #ff7b54;
      --p2-soft: rgba(255, 123, 84, 0.15);
      --p2-border: #ff7b54;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --panel-radius: 14px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-void);
      background-image: var(--bg-page-gradient);
      color: var(--text-main);
      font-family: var(--font-body);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .font-display { font-family: var(--font-heading) !important; }
    .font-mono { font-family: var(--font-code) !important; }

    .bg-grid-pattern {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, var(--grid-line-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line-color) 1px, transparent 1px);
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid var(--border-panel);
      box-shadow: var(--panel-shadow);
      border-radius: var(--panel-radius);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    html[data-aesthetic="paper"] .glass-panel {
      backdrop-filter: none;
      border-width: 2px;
    }

    .glass-subpanel {
      background: var(--bg-subpanel);
      border: 1px solid var(--border-subpanel);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    html[data-aesthetic="paper"] .glass-subpanel {
      border-width: 1.5px;
      border-style: solid;
      box-shadow: 1.5px 1.5px 0px rgba(58, 49, 42, 0.1);
    }

    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-slate-100,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-slate-200,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-white {
      color: var(--text-main) !important;
    }
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-slate-300,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-slate-400 {
      color: var(--text-muted) !important;
    }
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-slate-500,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .text-slate-600 {
      color: var(--text-faint) !important;
    }

    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-950\/80,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-950\/90,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-950\/60,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-950\/40,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-900\/90,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-900\/50,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .bg-slate-900 {
      background-color: var(--bg-control) !important;
    }

    html:not([data-aesthetic="scifi"][data-theme="dark"]) .border-slate-800,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .border-slate-800\/80,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .border-slate-800\/90,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .border-slate-700,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .border-slate-700\/70,
    html:not([data-aesthetic="scifi"][data-theme="dark"]) .border-slate-700\/80 {
      border-color: var(--border-subpanel) !important;
    }

    html[data-theme="light"] .text-cyan-300, html[data-theme="light"] .text-cyan-400, html[data-theme="light"] .text-sky-300, html[data-theme="light"] .text-sky-400 { color: var(--p1-color) !important; }
    html[data-theme="light"] .text-orange-300, html[data-theme="light"] .text-orange-200 { color: var(--p2-color) !important; }
    html[data-theme="light"] .text-emerald-300, html[data-theme="light"] .text-emerald-400 { color: #15803d !important; }
    html[data-theme="light"] .text-purple-300, html[data-theme="light"] .text-purple-400 { color: #6d28d9 !important; }
    html[data-theme="light"] .text-amber-300, html[data-theme="light"] .text-amber-400 { color: #b45309 !important; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.08); }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 9999px; }

    .macro-board { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
    .macro-board.macro-hovered { border-color: var(--p1-color) !important; box-shadow: 0 0 10px var(--p1-soft); }

    .micro-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--bg-cell) !important;
      border-color: var(--border-cell) !important;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html[data-aesthetic="paper"] .micro-cell { border-radius: 2px !important; border-width: 1px !important; }

    html[data-aesthetic="scifi"] .token-p1 {
      background: radial-gradient(circle at 32% 30%, #ffffff 0%, #7dd3fc 22%, #00f2fe 58%, #0284c7 100%);
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.55), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(186, 230, 253, 0.8);
    }
    html[data-aesthetic="scifi"] .token-p2 {
      background: radial-gradient(circle at 32% 30%, #ffffff 0%, #fed7aa 22%, #ff7b54 58%, #be123c 100%);
      box-shadow: 0 0 8px rgba(255, 123, 84, 0.55), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(254, 215, 170, 0.8);
    }

    html[data-aesthetic="paper"] .token-p1 {
      background: repeating-linear-gradient(-45deg, var(--p1-soft), var(--p1-soft) 2px, transparent 2px, transparent 4px);
      border: 2px solid var(--p1-color);
      border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;
      box-shadow: inset 0 0 0 1px var(--p1-soft);
      transform: rotate(-4deg);
    }
    html[data-aesthetic="paper"] .token-p2 {
      background: linear-gradient(45deg, transparent 42%, var(--p2-color) 43%, var(--p2-color) 57%, transparent 58%), linear-gradient(-45deg, transparent 42%, var(--p2-color) 43%, var(--p2-color) 57%, transparent 58%), var(--p2-soft);
      border: 2px solid var(--p2-color);
      border-radius: 52% 48% 49% 51% / 48% 52% 49% 51%;
      transform: rotate(3deg);
    }

    .ghost-p1 { background: var(--p1-soft); border: 1.5px dashed var(--p1-color); animation: ghostPulse 1.1s infinite ease-in-out; }
    .ghost-p2 { background: var(--p2-soft); border: 1.5px dashed var(--p2-color); animation: ghostPulse 1.1s infinite ease-in-out; }

    .col-highlight-p1 { background-color: var(--p1-soft) !important; border-color: var(--p1-color) !important; }
    .col-highlight-p2 { background-color: var(--p2-soft) !important; border-color: var(--p2-color) !important; }

    .threat-ring-p1 { box-shadow: inset 0 0 0 2px var(--p1-color); }
    .threat-ring-p2 { box-shadow: inset 0 0 0 2px var(--p2-color); }
    .threat-ring-both { box-shadow: inset 0 0 0 2px var(--p1-color), 0 0 0 2px var(--p2-color); }

    .win-cell-highlight { animation: winPulse 0.9s infinite alternate ease-in-out; z-index: 10; }

    @keyframes ghostPulse { 0%, 100% { transform: scale(0.84); opacity: 0.7; } 50% { transform: scale(0.95); opacity: 1; } }
    @keyframes winPulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.14); } }

    .player-card-p1-active { background-color: var(--p1-soft) !important; border: 2px solid var(--p1-color) !important; box-shadow: var(--panel-shadow); }
    .player-card-p2-active { background-color: var(--p2-soft) !important; border: 2px solid var(--p2-color) !important; box-shadow: var(--panel-shadow); }
    .player-card-inactive { background-color: var(--bg-subpanel) !important; border: 1.5px solid var(--border-subpanel) !important; }

    .victory-banner-p1 { background: var(--bg-panel) !important; border: 2.5px solid var(--p1-color) !important; box-shadow: var(--panel-shadow); }
    .victory-banner-p2 { background: var(--bg-panel) !important; border: 2.5px solid var(--p2-color) !important; box-shadow: var(--panel-shadow); }
    .victory-banner-draw { background: var(--bg-panel) !important; border: 2.5px solid var(--border-panel) !important; box-shadow: var(--panel-shadow); }

    body.boards-fullscreen-mode > header { display: none !important; }
    body.boards-fullscreen-mode > main { max-width: 100vw !important; height: 100vh !important; padding: 0.35rem !important; }
    body.boards-fullscreen-mode #workspace-grid { height: 100% !important; min-height: 0 !important; }

    .btn-sci { transition: all 0.14s ease; }
    .btn-sci:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-sci:active:not(:disabled) { transform: translateY(0px); }

    /* Responsive square matrix container dynamically sized by JS + CSS fallback so nothing is ever clipped */
    .matrix-fit-box {
      width: min(100%, calc(100vh - 290px));
      max-width: 100%;
    }
    body.boards-fullscreen-mode .matrix-fit-box {
      width: min(100%, calc(100vh - 165px));
    }

    /* ==========================================================================
       MOBILE PHONE LAYOUT ADAPTATIONS (< 768px ONLY)
       Keeps laptop/desktop/tablet (>= 768px) 100% identical while making
       mobile phones ergonomic, scrollable, and touch-friendly.
       ========================================================================== */
    @media (max-width: 767px) {
      html, body {
        height: auto !important;
        min-height: 100dvh !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
      }

      body > main {
        flex: none !important;
        height: auto !important;
        overflow: visible !important;
        padding-bottom: 1.25rem !important;
      }

      #workspace-grid {
        height: auto !important;
        overflow: visible !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 0.75rem !important;
      }

      #panel-2d,
      #panel-3d {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }

      #panel-2d-body {
        overflow: visible !important;
        height: auto !important;
        padding: 0.5rem !important;
      }

      .matrix-fit-box,
      body.boards-fullscreen-mode .matrix-fit-box {
        width: 100% !important;
        max-width: 100% !important;
      }

      #canvas-3d-wrapper {
        height: clamp(390px, 118vw, 520px) !important;
        min-height: 390px !important;
      }

      body.boards-fullscreen-mode > main {
        height: auto !important;
        min-height: 100dvh !important;
      }
    }

    #tesseract-canvas {
      touch-action: none;
    }

    @keyframes shakeAttention {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-attention {
      animation: shakeAttention 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-grid-pattern font-sans antialiased selection:bg-cyan-500 selection:text-slate-950 flex flex-col h-screen overflow-hidden">

  <!-- Floating Exit Fullscreen Button -->
  <button id="btn-exit-fullscreen" onclick="toggleFullscreenMode()" class="hidden fixed top-2.5 right-2.5 z-50 btn-sci px-3 py-1.5 rounded-xl glass-panel text-xs font-mono font-bold flex items-center gap-1.5 shadow-xl border-2 border-cyan-500/60" style="color: var(--text-main);" title="Exit Fullscreen (Shortcut: F or Esc)">
    <svg class="w-3.5 h-3.5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    <span>Exit Fullscreen [F]</span>
  </button>

  <!-- ================= COMPACT UNIFIED TOP HEADER (NO SCROLL ON DESKTOP, RESPONSIVE ON MOBILE) ================= -->
  <header class="glass-panel z-30 border-b border-slate-800/80 px-2.5 sm:px-4 py-1.5 shrink-0">
    <div class="max-w-[1920px] mx-auto flex flex-col gap-1.5">

      <!-- Top Row: Brand + Players/Controls + Modal Buttons -->
      <div class="flex flex-wrap lg:flex-nowrap items-center justify-between gap-2">

        <!-- Brand Logo & Name -->
        <div class="flex items-center gap-2 shrink-0">
          <div class="relative w-8 h-8 rounded-lg flex items-center justify-center shadow-sm shrink-0" style="background: var(--bg-cell); border: 1.5px solid var(--border-panel);">
            <svg class="w-4 h-4" style="color: var(--p1-color);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke-opacity="0.65"/>
              <rect x="7" y="7" width="10" height="10" rx="1" stroke="var(--p2-color)"/>
              <line x1="3" y1="3" x2="7" y2="7" stroke-opacity="0.7"/>
              <line x1="21" y1="3" x2="17" y2="7" stroke-opacity="0.7"/>
              <line x1="3" y1="21" x2="7" y2="17" stroke-opacity="0.7"/>
              <line x1="21" y1="21" x2="17" y2="17" stroke-opacity="0.7"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 id="brand-title" class="font-display font-extrabold text-sm sm:text-base tracking-wider leading-none" style="color: var(--text-main);">
                CONNECT 4D
              </
